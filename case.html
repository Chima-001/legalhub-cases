<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Chima Nnaji">
  <title>Case Detail - LegalHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="min-h-screen px-4 py-8" style="background: linear-gradient(135deg, #fdf6e3 0%, #f9e2a7 100%);">

  <div class="max-w-2xl mx-auto">
    <a href="index.html" class="text-sm text-[#c98a1f] hover:underline">&larr; Back to search</a>

    <div id="loading" class="text-center text-gray-500 mt-10">Loading case...</div>

    <div id="case-content" class="hidden mt-6 bg-white rounded-2xl p-6 border border-gray-200">
      <h1 id="case-title" class="text-xl font-bold text-gray-800"></h1>
      <p id="case-citation" class="text-sm text-gray-500 mt-1"></p>
      <p id="case-meta" class="text-sm text-gray-500"></p>

      <div class="mt-4 pt-4 border-t border-gray-100">
        <h2 class="text-sm font-semibold text-gray-700 mb-1">Summary</h2>
        <p id="case-summary" class="text-gray-700 text-sm leading-relaxed"></p>
      </div>

      <div class="mt-4 pt-4 border-t border-gray-100">
        <h2 class="text-sm font-semibold text-gray-700 mb-1">Full Text</h2>
        <div id="case-fulltext"
          class="text-gray-700 text-sm leading-relaxed whitespace-pre-line max-h-96 overflow-y-auto"></div>
      </div>
    </div>

    <p id="error-msg" class="hidden text-center text-red-500 mt-10"></p>
  </div>

  <script src="supabase-client.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const caseId = params.get("id");

    const loadingEl = document.getElementById("loading");
    const contentEl = document.getElementById("case-content");
    const errorEl = document.getElementById("error-msg");

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadCase() {
      if (!caseId) {
        showError("No case specified.");
        return;
      }

      // Session cache: once a case is loaded, don't re-fetch it again this
      // session if the user navigates back to it.
      const cacheKey = `case_${caseId}`;
      const cached = sessionStorage.getItem(cacheKey);

      if (cached) {
        render(JSON.parse(cached));
        return;
      }

      const { data, error } = await supabaseClient
        .from("cases")
        .select("title, citation, court, date_decided, summary, full_text, full_text_format, full_text_url")
        .eq("id", caseId)
        .single();

      if (error || !data) {
        showError("Case not found.");
        return;
      }

      sessionStorage.setItem(cacheKey, JSON.stringify(data));
      render(data);
    }

    function render(c) {
      document.getElementById("case-title").textContent = c.title || "Untitled case";
      document.getElementById("case-citation").textContent = c.citation || "";
      document.getElementById("case-meta").textContent =
        [c.court, c.date_decided].filter(Boolean).join(" \u00b7 ");
      document.getElementById("case-summary").textContent = c.summary || "No summary available.";

      const fullTextEl = document.getElementById("case-fulltext");
      if (c.full_text_format === "pdf" && c.full_text_url) {
        fullTextEl.innerHTML = `<a href="${c.full_text_url}" target="_blank" class="text-[#c98a1f] hover:underline">Open original PDF &rarr;</a>` +
          (c.full_text ? `<div class="mt-3">${escapeHtml(c.full_text)}</div>` : "");
      } else {
        fullTextEl.textContent = c.full_text || "Full text not available.";
      }

      loadingEl.classList.add("hidden");
      contentEl.classList.remove("hidden");
    }

    function showError(msg) {
      loadingEl.classList.add("hidden");
      errorEl.textContent = msg;
      errorEl.classList.remove("hidden");
    }

    loadCase();
  </script>
  <footer class="mt-8 mb-2 flex flex-col items-center gap-2 text-xs text-gray-400">
    <span>&copy; <span id="footer-year"></span> LegalHub</span>
    <span class="flex items-center gap-1.5">
      Powered by
      <a href="https://clopertechnologies.netlify.app" target="_blank" rel="noopener noreferrer" class="inline-flex">
        <img src="cloper-logo.svg" alt="Cloper Technologies" class="h-5" />
      </a>
    </span>
  </footer>
  <script>document.getElementById("footer-year").textContent = new Date().getFullYear();</script>
</body>

</html>
